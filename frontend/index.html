<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #ffffff;
  --panel: #f5f5f4;
  --panel-2: #efefee;
  --ink: #131313;
  --ink-2: #6b6b6b;
  --ink-3: #a3a3a1;
  --line: #e8e8e6;
  --accent: #131313;
  --on-accent: #ffffff;
  --ok: #3f7d58;
  --warn: #9a6b2f;
  --bad: #a4514b;
  --r-pill: 999px;
  --r-lg: 28px;
  --r-md: 16px;
  --r-sm: 10px;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f0f0f;
    --panel: #1a1a19;
    --panel-2: #232322;
    --ink: #f2f2f0;
    --ink-2: #a1a1a0;
    --ink-3: #6e6e6d;
    --line: #2a2a29;
    --accent: #f2f2f0;
    --on-accent: #131313;
    --ok: #7fbf95;
    --warn: #d3a568;
    --bad: #d98d87;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button { font-family: inherit; font-size: inherit; cursor: pointer; border: none; background: none; color: inherit; }

/* ---------- nav ---------- */
.nav-wrap { position: sticky; top: 0; z-index: 40; padding: 18px 20px; background: linear-gradient(var(--bg) 60%, transparent); }
.nav {
  max-width: 520px; margin: 0 auto; background: var(--panel);
  border-radius: var(--r-pill); padding: 10px 10px 10px 20px;
  display: flex; align-items: center; gap: 18px;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: -.02em; margin-right: auto; }
.brand-dot { width: 15px; height: 15px; border-radius: 5px; background: var(--ink); display: inline-block; }
.nav-link { color: var(--ink-2); font-size: 14px; padding: 6px 4px; }
.nav-link:hover { color: var(--ink); }
.nav-btn { background: var(--accent); color: var(--on-accent); border-radius: var(--r-pill); padding: 8px 16px; font-size: 14px; font-weight: 500; }

/* ---------- layout ---------- */
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px 100px; }
.hero { text-align: center; padding: 64px 0 34px; }
.hero h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1.08; letter-spacing: -.035em; font-weight: 500; margin: 0 0 16px; }
.hero p { color: var(--ink-2); font-size: 17px; max-width: 520px; margin: 0 auto; }

.searchbar {
  max-width: 640px; margin: 34px auto 0; background: var(--panel);
  border-radius: var(--r-pill); padding: 7px 7px 7px 22px;
  display: flex; align-items: center; gap: 12px; transition: box-shadow .18s ease;
}
.searchbar:focus-within { box-shadow: 0 0 0 3px var(--panel-2); }
.searchbar input {
  flex: 1; border: none; background: none; outline: none; color: var(--ink);
  font-family: inherit; font-size: 16px; padding: 12px 0;
}
.searchbar input::placeholder { color: var(--ink-3); }
.go { background: var(--accent); color: var(--on-accent); border-radius: var(--r-pill); padding: 12px 24px; font-weight: 500; white-space: nowrap; }
.go:disabled { opacity: .45; cursor: default; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 20px auto 0; max-width: 700px; }
.chip { background: var(--panel); color: var(--ink-2); border-radius: var(--r-pill); padding: 8px 15px; font-size: 13.5px; transition: background .15s, color .15s; }
.chip:hover { background: var(--panel-2); color: var(--ink); }

/* ---------- run view ---------- */
.run { display: grid; grid-template-columns: 1fr 380px; gap: 20px; margin-top: 40px; align-items: start; }
@media (max-width: 900px) { .run { grid-template-columns: 1fr; } }
.card { background: var(--panel); border-radius: var(--r-lg); padding: 26px 28px; }
.label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin-bottom: 16px; }

.stage { display: flex; gap: 13px; align-items: flex-start; padding: 11px 0; }
.stage + .stage { border-top: 1px solid var(--line); }
.dot { width: 17px; height: 17px; border-radius: 50%; flex: 0 0 17px; margin-top: 3px; background: var(--panel-2); display: grid; place-items: center; font-size: 10px; color: var(--ink-3); }
.dot.on { background: var(--ink); color: var(--bg); }
.dot.run { background: var(--panel-2); position: relative; }
.dot.run::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--ink-3); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1); } }
.stage-txt { font-size: 14.5px; color: var(--ink); }
.stage.pending .stage-txt { color: var(--ink-3); }

.plan-fields { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 14px; }
.tag { background: var(--panel-2); border-radius: var(--r-pill); padding: 5px 12px; font-size: 12.5px; color: var(--ink-2); }
.tag.cut { text-decoration: line-through; opacity: .5; }

/* ---------- live stream ---------- */
.stream { background: var(--panel); border-radius: var(--r-lg); padding: 22px; position: sticky; top: 96px; }
.stream-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.stream-count { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.feed { font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11.5px; line-height: 1.5; max-height: 420px; overflow-y: auto; scrollbar-width: thin; }
.feed::-webkit-scrollbar { width: 5px; }
.feed::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
.row { display: flex; gap: 8px; padding: 5px 0; align-items: baseline; animation: slide .26s ease both; border-bottom: 1px solid transparent; }
@keyframes slide { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }
.row .mark { flex: 0 0 9px; color: var(--ink-3); }
.row.ok .mark { color: var(--ok); }
.row.err .mark { color: var(--bad); }
.row .host { color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
.row.pending .host { color: var(--ink-3); }
.row .meta { color: var(--ink-3); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.row .meta .ld { color: var(--ok); }
.caret { display: inline-block; width: 6px; height: 12px; background: var(--ink); animation: blink 1s steps(2) infinite; vertical-align: -2px; }
@keyframes blink { 0%,50% { opacity: 1; } 51%,100% { opacity: 0; } }

/* ---------- results ---------- */
.results-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 52px 0 20px; flex-wrap: wrap; }
.results-head h2 { font-size: 30px; letter-spacing: -.03em; font-weight: 500; margin: 0; }
.sub { color: var(--ink-3); font-size: 13.5px; margin-top: 5px; }
.tools { display: flex; gap: 8px; align-items: center; }
.tool { background: var(--panel); border-radius: var(--r-pill); padding: 9px 16px; font-size: 13.5px; color: var(--ink-2); }
.tool:hover { background: var(--panel-2); color: var(--ink); }
.seg { background: var(--panel); border-radius: var(--r-pill); padding: 3px; display: flex; gap: 2px; }
.seg button { border-radius: var(--r-pill); padding: 7px 15px; font-size: 13.5px; color: var(--ink-3); }
.seg button.on { background: var(--bg); color: var(--ink); font-weight: 500; }

.notice { background: var(--panel); border-radius: var(--r-md); padding: 14px 18px; font-size: 13.5px; color: var(--ink-2); margin-bottom: 18px; }
.notice b { color: var(--ink); font-weight: 500; }

.table-wrap { overflow-x: auto; border-radius: var(--r-lg); background: var(--panel); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; padding: 18px 18px 12px; white-space: nowrap; }
td { padding: 15px 18px; border-top: 1px solid var(--line); vertical-align: top; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover { background: var(--panel-2); }
.ent { font-weight: 500; letter-spacing: -.01em; }
.cell { display: flex; align-items: baseline; gap: 7px; }
.cell-v { flex: 1; min-width: 0; }
.cdot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; margin-top: 6px; }
.c-hi { background: var(--ok); }
.c-mid { background: var(--warn); }
.c-lo { background: var(--bad); }
.lowflag { font-size: 11px; color: var(--warn); display: block; margin-top: 3px; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(285px, 1fr)); gap: 14px; }
.ecard { background: var(--panel); border-radius: var(--r-md); padding: 20px 22px; cursor: pointer; transition: background .12s; }
.ecard:hover { background: var(--panel-2); }
.ecard h3 { margin: 0 0 14px; font-size: 16.5px; font-weight: 500; letter-spacing: -.015em; }
.kv { display: flex; justify-content: space-between; gap: 14px; padding: 6px 0; font-size: 13.5px; border-top: 1px solid var(--line); }
.kv .k { color: var(--ink-3); flex: 0 0 auto; }
.kv .v { text-align: right; }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .22s; z-index: 60; }
.scrim.on { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(480px, 92vw); background: var(--bg);
  z-index: 61; transform: translateX(100%); transition: transform .28s cubic-bezier(.32,.72,0,1);
  overflow-y: auto; padding: 30px 30px 60px;
}
.drawer.on { transform: none; }
.drawer h3 { margin: 0 0 4px; font-size: 24px; font-weight: 500; letter-spacing: -.025em; }
.dclose { position: absolute; top: 22px; right: 24px; color: var(--ink-3); font-size: 20px; line-height: 1; }
.dfield { padding: 16px 0; border-top: 1px solid var(--line); }
.dfield .k { font-size: 10.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
.dfield .v { font-size: 15px; }
.quote { border-left: 2px solid var(--line); padding-left: 11px; margin-top: 9px; color: var(--ink-2); font-size: 13px; font-style: italic; }
.src { font-size: 12px; color: var(--ink-3); margin-top: 7px; word-break: break-all; }
.conf-row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--ink-2); }
.bar { flex: 1; height: 3px; background: var(--panel-2); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink-3); }

.empty { text-align: center; padding: 70px 20px; color: var(--ink-3); }
.err { background: var(--panel); border-radius: var(--r-md); padding: 16px 20px; color: var(--bad); font-size: 14px; }
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="nav-wrap">
  <nav class="nav">
    <span class="brand"><i class="brand-dot"></i> Agentic Search</span>
    <a class="nav-link" href="#" id="link-sources">Sources</a>
    <button class="nav-link" id="btn-clear">Clear cache</button>
  </nav>
</div>

<div class="wrap">

  <section class="hero" id="hero">
    <h1>Turn any question<br>into a structured table.</h1>
    <p>Searches the web, reads the pages, and returns rows and columns — with every cell filled and scored.</p>
  </section>

  <div class="searchbar">
    <input id="q" placeholder="Try “best laptops 2025”" autocomplete="off" spellcheck="false">
    <button class="go" id="go">Search</button>
  </div>

  <div class="chips" id="chips"></div>

  <div class="run hidden" id="run">
    <div class="card">
      <div class="label">Progress</div>
      <div id="stages"></div>
      <div id="plan"></div>
    </div>
    <aside class="stream">
      <div class="stream-head">
        <div class="label" style="margin:0">Reading the web</div>
        <span class="stream-count" id="scount"></span>
      </div>
      <div class="feed" id="feed"></div>
    </aside>
  </div>

  <div id="err-box"></div>

  <div class="hidden" id="results">
    <div class="results-head">
      <div>
        <h2 id="rtitle"></h2>
        <div class="sub" id="rsub"></div>
      </div>
      <div class="tools">
        <button class="tool" id="dl-json">JSON</button>
        <button class="tool" id="dl-csv">CSV</button>
        <div class="seg">
          <button id="v-table" class="on">Table</button>
          <button id="v-cards">Cards</button>
        </div>
      </div>
    </div>
    <div id="notice"></div>
    <div class="table-wrap" id="table-wrap"><table id="table"></table></div>
    <div class="cards hidden" id="cards"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <button class="dclose" id="dclose">✕</button>
  <h3 id="d-title"></h3>
  <div class="sub" id="d-sub"></div>
  <div id="d-body"></div>
</aside>

<script>
const SAMPLES = ['best laptops 2025', 'AI startups in healthcare', 'open source databases',
                 'VC firms in Boston', 'top pizza in Brooklyn'];
const STAGE_NAMES = ['Checking cache', 'Planning', 'Searching', 'Reading pages', 'Extracting', 'Scoring & auditing'];

let lastTable = null, view = 'table', streamCount = 0, okCount = 0;

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/* ---------- chips ---------- */
SAMPLES.forEach(s => {
  const b = document.createElement('button');
  b.className = 'chip';
  b.textContent = s;
  b.onclick = () => { $('q').value = s; run(); };
  $('chips').appendChild(b);
});

/* ---------- stages ---------- */
function paintStages(active) {
  $('stages').innerHTML = '';
  STAGE_NAMES.forEach((name, i) => {
    const done = i < active, now = i === active;
    const el = document.createElement('div');
    el.className = 'stage' + (done || now ? '' : ' pending');
    el.innerHTML = `<span class="dot ${done ? 'on' : now ? 'run' : ''}">${done ? '✓' : ''}</span>
                    <span class="stage-txt">${esc(name)}</span>`;
    $('stages').appendChild(el);
  });
}

/* ---------- live source feed ---------- */
const feedRows = new Map();

function feedEvent(d) {
  if (d.status === 'timeout') {
    addFeedLine('~', `${d.count} slow pages abandoned`, '', 'pending');
    return;
  }
  const key = d.url;
  if (d.status === 'fetching') {
    streamCount++;
    const row = addFeedLine('▸', d.domain, '', 'pending');
    feedRows.set(key, row);
  } else {
    const row = feedRows.get(key);
    const ok = d.status === 'ok';
    if (ok) okCount++;
    const meta = ok
      ? `${(d.chars / 1000).toFixed(1)}k${d.structured ? ' <span class="ld">ld+json</span>' : ''}`
      : esc((d.detail || 'failed').slice(0, 18));
    if (row) {
      row.className = 'row ' + (ok ? 'ok' : 'err');
      row.querySelector('.mark').textContent = ok ? '✓' : '✕';
      row.querySelector('.meta').innerHTML = meta;
    } else {
      addFeedLine(ok ? '✓' : '✕', d.domain, meta, ok ? 'ok' : 'err');
    }
  }
  $('scount').textContent = `${okCount}/${streamCount}`;
}

function addFeedLine(mark, host, meta, cls) {
  const row = document.createElement('div');
  row.className = 'row ' + cls;
  row.innerHTML = `<span class="mark">${mark}</span><span class="host">${esc(host)}</span><span class="meta">${meta}</span>`;
  $('feed').appendChild(row);
  $('feed').scrollTop = $('feed').scrollHeight;
  return row;
}

/* ---------- run ---------- */
async function run() {
  const query = $('q').value.trim();
  if (query.length < 3) return;

  lastTable = null;
  streamCount = 0; okCount = 0;
  feedRows.clear();
  $('feed').innerHTML = '<div class="row pending"><span class="mark"></span><span class="host">waiting for URLs <span class="caret"></span></span><span class="meta"></span></div>';
  $('scount').textContent = '';
  $('run').classList.remove('hidden');
  $('results').classList.add('hidden');
  $('err-box').innerHTML = '';
  $('plan').innerHTML = '';
  $('notice').innerHTML = '';
  $('go').disabled = true;
  paintStages(0);

  let res;
  try {
    res = await fetch('/api/search', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query })
    });
  } catch (e) {
    fail('Could not reach the server.'); return;
  }
  if (!res.ok) { fail('Request rejected (' + res.status + ').'); return; }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const parts = buf.split('\n\n');
    buf = parts.pop();
    for (const chunk of parts) handleEvent(chunk);
  }
  $('go').disabled = false;
}

function handleEvent(chunk) {
  let name = '', data = '';
  for (const line of chunk.split('\n')) {
    if (line.startsWith('event: ')) name = line.slice(7).trim();
    else if (line.startsWith('data: ')) data = line.slice(6);
  }
  if (!data) return;
  let d; try { d = JSON.parse(data); } catch { return; }

  if (name === 'status') {
    paintStages(d.stage);
    if (d.message && /Dropped/.test(d.message)) {
      $('notice').innerHTML = `<div class="notice">${esc(d.message)} — a column is removed when too few rows could fill it, rather than shown blank.</div>`;
    }
  } else if (name === 'plan') {
    $('plan').innerHTML = `<div class="label" style="margin-top:24px">Schema</div>
      <div style="font-size:14.5px">Looking for <b>${esc(d.entity_type)}</b></div>
      <div class="plan-fields">${d.schema_fields.map(f => `<span class="tag">${esc(f)}</span>`).join('')}</div>`;
  } else if (name === 'source') {
    if (feedRows.size === 0 && $('feed').querySelector('.caret')) $('feed').innerHTML = '';
    feedEvent(d);
  } else if (name === 'results') {
    lastTable = d.table;
    paintStages(6);
    render(d);
  } else if (name === 'error') {
    fail(d.message);
  }
}

function fail(msg) {
  $('err-box').innerHTML = `<div class="err">${esc(msg)}</div>`;
  $('go').disabled = false;
}

/* ---------- rendering ---------- */
const confClass = c => c >= 0.75 ? 'c-hi' : c >= 0.55 ? 'c-mid' : 'c-lo';

function render(payload) {
  const t = payload.table;
  const fields = t.schema_fields.filter(f => f !== 'name');
  $('results').classList.remove('hidden');
  $('rtitle').textContent = `${t.entities.length} ${t.entity_type}${t.entities.length === 1 ? '' : 's'}`;
  $('rsub').textContent = `${payload.elapsed_seconds}s · ${t.sources.length} sources read · every cell filled`;

  if (t.dropped_fields && t.dropped_fields.length && !$('notice').innerHTML) {
    $('notice').innerHTML = `<div class="notice">Dropped <b>${t.dropped_fields.map(esc).join(', ')}</b> — too few rows could fill ${t.dropped_fields.length === 1 ? 'it' : 'them'}, so ${t.dropped_fields.length === 1 ? 'it was' : 'they were'} removed rather than left blank.</div>`;
  }

  if (!t.entities.length) {
    $('table-wrap').innerHTML = '<div class="empty">Nothing could be extracted for this query.</div>';
    $('cards').innerHTML = '';
    return;
  }
  $('table-wrap').innerHTML = '<table id="table"></table>';
  renderTable(t, fields);
  renderCards(t, fields);
}

function renderTable(t, fields) {
  const table = $('table');
  table.innerHTML = '';
  const thead = table.createTHead().insertRow();
  ['Entity', ...fields.map(f => f.replace(/_/g, ' '))].forEach(h => {
    const th = document.createElement('th'); th.textContent = h; thead.appendChild(th);
  });
  const tb = table.createTBody();
  t.entities.forEach(e => {
    const tr = tb.insertRow();
    tr.onclick = () => openDrawer(e, fields);
    const nameCell = tr.insertCell();
    nameCell.className = 'ent';
    nameCell.textContent = e.name;
    fields.forEach(f => {
      const td = tr.insertCell();
      const a = e.attributes[f];
      if (!a || a.value === null || a.value === '') { td.textContent = '—'; return; }
      const wrap = document.createElement('div');
      wrap.className = 'cell';
      const dot = document.createElement('span');
      dot.className = 'cdot ' + confClass(a.confidence);
      dot.title = `confidence ${a.confidence}`;
      const v = document.createElement('span');
      v.className = 'cell-v';
      v.textContent = a.value;            // textContent, not innerHTML: this is scraped text
      wrap.append(dot, v);
      td.appendChild(wrap);
      if (a.confidence < 0.55 && a.confidence_reason) {
        const flag = document.createElement('span');
        flag.className = 'lowflag';
        flag.textContent = 'low confidence · ' + a.confidence_reason;
        td.appendChild(flag);
      }
    });
  });
}

function renderCards(t, fields) {
  $('cards').innerHTML = '';
  t.entities.forEach(e => {
    const c = document.createElement('div');
    c.className = 'ecard';
    c.onclick = () => openDrawer(e, fields);
    const h = document.createElement('h3');
    h.textContent = e.name;
    c.appendChild(h);
    fields.forEach(f => {
      const a = e.attributes[f];
      if (!a || a.value === null || a.value === '') return;
      const row = document.createElement('div');
      row.className = 'kv';
      const k = document.createElement('span'); k.className = 'k'; k.textContent = f.replace(/_/g, ' ');
      const v = document.createElement('span'); v.className = 'v'; v.textContent = a.value;
      row.append(k, v);
      c.appendChild(row);
    });
    $('cards').appendChild(c);
  });
}

function openDrawer(e, fields) {
  $('d-title').textContent = e.name;
  $('d-sub').textContent = `row confidence ${e.confidence}`;
  const body = $('d-body');
  body.innerHTML = '';
  fields.forEach(f => {
    const a = e.attributes[f];
    if (!a || a.value === null || a.value === '') return;
    const d = document.createElement('div');
    d.className = 'dfield';
    const k = document.createElement('div'); k.className = 'k'; k.textContent = f.replace(/_/g, ' ');
    const v = document.createElement('div'); v.className = 'v'; v.textContent = a.value;
    d.append(k, v);
    if (a.source_snippet) {
      const q = document.createElement('div'); q.className = 'quote';
      q.textContent = '“' + a.source_snippet + '”';
      d.appendChild(q);
    }
    const cr = document.createElement('div');
    cr.className = 'conf-row';
    cr.innerHTML = `<span>${a.confidence}</span><span class="bar"><i style="width:${Math.round(a.confidence * 100)}%"></i></span>`
      + (a.agreement_count > 1 ? `<span>${a.agreement_count} sources agree</span>` : '<span>1 source</span>');
    d.appendChild(cr);
    if (a.confidence_reason) {
      const r = document.createElement('div');
      r.className = 'src'; r.style.color = 'var(--warn)';
      r.textContent = a.confidence_reason;
      d.appendChild(r);
    }
    if (a.source_url) {
      const s = document.createElement('a');
      s.className = 'src'; s.href = a.source_url; s.target = '_blank'; s.rel = 'noopener noreferrer';
      s.style.display = 'block';
      s.textContent = a.source_url;
      d.appendChild(s);
    }
    body.appendChild(d);
  });
  $('drawer').classList.add('on');
  $('scrim').classList.add('on');
}

function closeDrawer() {
  $('drawer').classList.remove('on');
  $('scrim').classList.remove('on');
}

/* ---------- exports ---------- */
function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type }));
  const a = document.createElement('a');
  a.href = url; a.download = name; a.click();
  URL.revokeObjectURL(url);
}

$('dl-json').onclick = () => lastTable && download('results.json', JSON.stringify(lastTable, null, 2), 'application/json');
$('dl-csv').onclick = () => {
  if (!lastTable) return;
  const fields = lastTable.schema_fields.filter(f => f !== 'name');
  const q = s => '"' + String(s ?? '').replace(/"/g, '""') + '"';
  const lines = [['name', ...fields, 'confidence'].map(q).join(',')];
  lastTable.entities.forEach(e => {
    lines.push([q(e.name), ...fields.map(f => q(e.attributes[f]?.value ?? '')), q(e.confidence)].join(','));
  });
  download('results.csv', lines.join('\n'), 'text/csv');
};
$('link-sources').onclick = ev => {
  ev.preventDefault();
  if (!lastTable) return;
  $('d-title').textContent = 'Sources';
  $('d-sub').textContent = `${lastTable.sources.length} URLs`;
  $('d-body').innerHTML = lastTable.sources
    .map(u => `<div class="dfield"><a class="src" style="display:block" href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(u)}</a></div>`)
    .join('');
  $('drawer').classList.add('on'); $('scrim').classList.add('on');
};
$('btn-clear').onclick = async () => {
  await fetch('/api/cache', { method: 'DELETE' });
  $('btn-clear').textContent = 'Cleared';
  setTimeout(() => $('btn-clear').textContent = 'Clear cache', 1600);
};

$('v-table').onclick = () => { view = 'table'; $('v-table').classList.add('on'); $('v-cards').classList.remove('on'); $('table-wrap').classList.remove('hidden'); $('cards').classList.add('hidden'); };
$('v-cards').onclick = () => { view = 'cards'; $('v-cards').classList.add('on'); $('v-table').classList.remove('on'); $('cards').classList.remove('hidden'); $('table-wrap').classList.add('hidden'); };

$('go').onclick = run;
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
$('scrim').onclick = closeDrawer;
$('dclose').onclick = closeDrawer;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
</script>
</body>
</html>
